{% extends "base.html" %}
{% block body %}
    <style>
        .title{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            color: #753348;
            margin: 50px;
            border-radius: 50px;
            font-family: 'Courier New', Courier, monospace;
            background-color:rgb(252, 249, 245); /* Light beige */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: 2px solid #ab3387; /* Wine */
        }
        .title h1{
            font-size: 50px;
            font-family: 'Ubuntu', monospace;
            color: #ab3387; /* Wine */
            text-transform: uppercase;
            text-align: center;
            lettering-spacing: 4px;
        }
        .content{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            color: #753348;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
            background-color:rgb(252, 249, 245); /* Light beige */
            border-top: 2px solid #ab3387; /* Wine */
        }
    </style>
    <div class="title">
        <h3> Welcome to </h3>

        <h1> Bank Application </h1>
        <form action="/profile" method="POST">
            <div class="inputs">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
            </div>
        <button type="submit">Log in</button>
      </form>
    </div>
{% endblock %}
